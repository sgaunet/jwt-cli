name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Toolchain (Go, task, golangci-lint, ...) is pinned in mise.toml
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Run unit tests with the race detector
        run: task unit-tests

      # venom is pinned in mise.toml, so mise-action above already installed it.
      # The suite generates its own keys with openssl/ssh-keygen, both present
      # on ubuntu-latest.
      - name: Run integration tests
        run: task tests
