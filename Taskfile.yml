# https://taskfile.dev
version: '3'
vars:
  BINFILE: jwt-cli

tasks:
  default:
    desc: "List tasks"
    cmds:
      - task -a

  lint:
    desc: "Run linter"
    cmds:
      - golangci-lint run
      # `run` honours run.tests: false, so formatters never see _test.go files;
      # `fmt --diff` checks every file and exits non-zero when one is unformatted.
      - golangci-lint fmt --diff

  vulncheck:
    desc: "Scan dependencies for known vulnerabilities"
    cmds:
      - govulncheck ./...
  
  binary:
    desc: "Build binary"
    cmds:
      # Mirrors the release build in .goreleaser.yml: -s -w strips the symbol
      # table and DWARF data, -trimpath keeps local paths out of the binary.
      - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" .

  install:
    desc: "Install godoc binary"
    cmds:
      - go get golang.org/x/tools/cmd/godoc

  demo:
    desc: "Generate demo.gif"
    # The tape puts the repo root on PATH, so the binary has to exist first.
    deps: [binary]
    cmds:
      - vhs doc/demo.tape

  doc:
    desc: "Run godoc server"
    cmds:
      - echo http://localhost:6060
      - godoc -http=:6060
  
  snapshot:
    desc: "Create a snapshot"
    cmds:
      - GITLAB_TOKEN="" goreleaser --clean --snapshot
    
  release:
    desc: "Create a release"
    cmds:
      - GITLAB_TOKEN="" goreleaser --clean

  unit-tests:
    desc: "Run Go unit tests with the race detector"
    cmds:
      - go test -race ./...

  tests:
    desc: "Run tests"
    dir: tests
    cmds:
      - venom run testsuite.yml --output-dir="log" --stop-on-failure
