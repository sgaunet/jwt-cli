---
version: "2"
# Configure which files to skip during linting
run:
  tests: false

linters:
  default: all

  disable:
    - wsl
    - wsl_v5
    - nlreturn
    - depguard
    - gochecknoinits
    - gochecknoglobals
    - forbidigo
    - varnamelen
    - exhaustruct
    - tagliatelle
    - noinlineerr
    - ireturn      # Returning interfaces is intentional for our design
    - lll          # Line length limit is too restrictive for function signatures
    - nolintlint   # We use nolint directives where needed

formatters:
  # golangci-lint v2 treats gofmt/goimports as formatters, a category separate
  # from linters; without this section `run` reports 0 issues on unformatted code.
  enable:
    - gofmt
    - goimports
