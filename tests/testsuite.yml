# PASETO Tests
- name: generate_PASETO_local_key
  steps:
  - type: exec
    script: |
      openssl rand -hex 32
    assertions:
    - result.code ShouldEqual 0
    vars:
      paseto_key:
        from: result.systemout

- name: encode_PASETO_v4_local
  steps:
  - type: exec
    script: |
      cd ..
      go run . paseto encode local --version v4 --key '{{.generate_PASETO_local_key.paseto_key}}' --payload '{ "email": "{{.EMAIL}}" }' 
    assertions:
    - result.code ShouldEqual 0
    - result.systemout ShouldContainSubstring v4.local.
    vars:
      token:
        from: result.systemout

- name: decode_PASETO_v4_local
