# Execute the key-generation recipes the genkeys subcommands print, so a recipe
# that produces an unusable key fails the suite.
- name: PASETO_genkeys_v4_recipe_works
  steps:
  - type: exec
    script: |
      cd ..
      eval "$(go run . paseto genkeys v4 | grep '^openssl' | tail -2)"
      TOKEN=$(go run . paseto encode public --version v4 --private-key paseto-v4-private.pem --payload '{ "email": "{{.EMAIL}}" }')
      go run . paseto decode public --version v4 --public-key paseto-v4-public.pem --token "$TOKEN"
      rm -f paseto-v4-private.pem paseto-v4-public.pem
    assertions:
    - result.code ShouldEqual 0
    - result.systemout ShouldContainSubstring {{.EMAIL}}

